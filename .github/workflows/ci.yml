name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: gcc
            cxx: g++
          - os: ubuntu-latest
            toolchain: clang
            cxx: clang++
          - os: macos-latest
            toolchain: clang
            cxx: clang++
          - os: windows-latest
            toolchain: msvc
            cxx: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: configure (gcc / clang)
        if: matrix.toolchain != 'msvc'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: configure (msvc)
        if: matrix.toolchain == 'msvc'
        run: cmake -B build -A x64

      - name: build
        run: cmake --build build --parallel --config Release

      - name: smoke (msvc crash context)
        if: matrix.toolchain == 'msvc'
        continue-on-error: true
        run: build/Release/test_module_analysis.exe

      - name: test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 600

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: >
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: build
        run: cmake --build build-asan --parallel

      - name: test
        run: ctest --test-dir build-asan --output-on-failure --timeout 900

  thread-sanitize:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: >
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=thread"

      - name: build
        run: cmake --build build-tsan --parallel

      - name: test
        # 并发路径(job 池/帧池/任务图)的同步协议尚未完成, 已知竞争见 thread/base/job.hpp 顶部说明;
        # TSan 仍覆盖 part/ecs/reflection/serialization 与 thread 的同步原语测试
        run: ctest --test-dir build-tsan -E "test_perf|task_graph|thread_app" --output-on-failure --timeout 900
