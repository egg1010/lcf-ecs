name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: gcc
            cxx: g++
          - os: ubuntu-latest
            toolchain: clang
            cxx: clang++
          - os: macos-latest
            toolchain: clang
            cxx: clang++
          - os: windows-latest
            toolchain: msvc
            cxx: ""
          - os: windows-latest
            toolchain: mingw
            cxx: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        if: matrix.toolchain == 'mingw'
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: configure (gcc / clang)
        if: matrix.toolchain != 'msvc' && matrix.toolchain != 'mingw'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: configure (msvc)
        if: matrix.toolchain == 'msvc'
        run: cmake -B build -A x64

      - name: configure (mingw)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: build (native)
        if: matrix.toolchain != 'mingw'
        run: cmake --build build --parallel --config Release

      - name: build (mingw)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: smoke (msvc crash context)
        if: matrix.toolchain == 'msvc'
        continue-on-error: true
        run: build/Release/test_module_analysis.exe

      - name: test (native)
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: |
          set +e
          ctest --test-dir build -C Release --output-on-failure --timeout 600
          rc=$?
          log=build/Testing/Temporary
          if [ "$rc" -ne 0 ] && [ -f "$log/LastTestsFailed.log" ]; then
            while IFS= read -r line; do
              echo "::error title=Failed test::$line"
            done < "$log/LastTestsFailed.log"
          fi
          if [ "$rc" -ne 0 ] && [ -f "$log/LastTest.log" ]; then
            grep -n -E "Assertion|Access violation|Exception|CHECK|FAILED|Segmentation|abort" "$log/LastTest.log" | head -40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=Test detail::$line"
            done
          fi
          exit "$rc"

      - name: test (mingw)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --timeout 600

  config-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-no-lto
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DLCF_ENABLE_LTO=OFF"
          - name: no-isa-minimal-stack
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DLCF_NO_ISA=ON -DLCF_STACK_MINIMAL=ON -DLCF_ENABLE_LTO=OFF"
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: >
          cmake -B build -DCMAKE_CXX_COMPILER=g++
          ${{ matrix.cmake_flags }}
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: |
          set +e
          ctest --test-dir build --output-on-failure --timeout 600
          rc=$?
          if [ "$rc" -ne 0 ] && [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
            while IFS= read -r line; do
              echo "::error title=Config test failed::$line"
            done < build/Testing/Temporary/LastTestsFailed.log
          fi
          exit "$rc"

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: >
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++ -DLCF_ENABLE_LTO=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: build
        run: cmake --build build-asan --parallel

      - name: test
        run: |
          set +e
          ctest --test-dir build-asan --output-on-failure --timeout 900
          rc=$?
          if [ "$rc" -ne 0 ] && [ -f build-asan/Testing/Temporary/LastTestsFailed.log ]; then
            while IFS= read -r line; do
              echo "::error title=Sanitizer failed test::$line"
            done < build-asan/Testing/Temporary/LastTestsFailed.log
          fi
          if [ "$rc" -ne 0 ] && [ -f build-asan/Testing/Temporary/LastTest.log ]; then
            grep -n -E "ERROR: AddressSanitizer|ERROR: LeakSanitizer|SUMMARY: (Address|Leak)Sanitizer|runtime error:" build-asan/Testing/Temporary/LastTest.log | head -40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=Sanitizer detail::$line"
            done
          fi
          exit "$rc"

  thread-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: >
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++ -DLCF_ENABLE_LTO=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DBUILD_PERF_TESTS=OFF

      - name: build
        run: cmake --build build-tsan --parallel

      - name: test
        # 排除未参与并发门禁的性能基准, 其余线程/任务图/应用路径全部纳入
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set +e
          setarch "$(uname -m)" -R ctest --test-dir build-tsan -E "test_perf" --output-on-failure --timeout 900
          rc=$?
          if [ "$rc" -ne 0 ] && [ -f build-tsan/Testing/Temporary/LastTestsFailed.log ]; then
            failed=$(tr '\n' ',' < build-tsan/Testing/Temporary/LastTestsFailed.log)
            echo "::error title=TSan failed tests::$failed"
          fi
          if [ "$rc" -ne 0 ] && [ -f build-tsan/Testing/Temporary/LastTest.log ]; then
            grep -n -E "WARNING: ThreadSanitizer|SUMMARY: ThreadSanitizer|^    #[0-1] |Location is|Read of size|Write of size|Previous (read|write)|Thread T[0-9]+" build-tsan/Testing/Temporary/LastTest.log | head -60 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=TSan detail::$line"
            done
          fi
          exit "$rc"

  performance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: build
        run: cmake --build build --parallel

      - name: gate
        run: python3 tools/perf_gate.py --build-dir build --save-baseline perf-baseline.json

      - uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: perf-baseline.json
