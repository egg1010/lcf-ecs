<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCF-ECS 接口文档</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body>
  <!-- 粒子背景 -->
  <div class="particle-bg"></div>

  <div class="app">
    <!-- Logo 栏 -->
    <div class="logo-bar">
      <div class="logo-icon">L</div>
      <div class="logo-text">LCF-ECS</div>
    </div>

    <!-- 顶部导航 -->
    <div class="topbar">
      <button class="btn btn-icon mobile-menu-btn" title="菜单">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" placeholder="搜索模块或接口... ( 按 / 聚焦 )" autocomplete="off">
      </div>

      <div class="topbar-spacer"></div>

      <a class="btn" href="https://github.com/egg1010/lcf-ecs" target="_blank" rel="noopener" title="源码">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        <span>GitHub</span>
      </a>

      <button class="btn btn-icon theme-toggle" title="切换主题">🌙</button>
    </div>

    <!-- 侧边栏 -->
    <div class="sidebar"></div>

    <!-- 主内容 -->
    <div class="main">
      <div class="content"></div>
    </div>
  </div>

  <!-- 回到顶部 -->
  <button class="back-to-top" title="回到顶部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <!-- 搜索结果 (独立于 topbar, 避免 backdrop-filter 影响 fixed 定位) -->
  <div class="search-results"></div>

  <!-- 数据文件 (按分类加载) -->
  <script src="data/cat_core.js"></script>
  <script src="data/cat_config.js"></script>
  <script src="data/cat_containers.js"></script>
  <script src="data/cat_allocators.js"></script>
  <script src="data/cat_algorithms.js"></script>
  <script src="data/cat_tools.js"></script>
  <script src="data/cat_utf8.js"></script>

  <!-- 应用 JS -->
  <script src="js/md.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
